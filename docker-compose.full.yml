services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-bot-hoshizune-postgres-full
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_bot_hoshizune
    ports:
      - "${POSTGRES_PORT:-2406}:5432"
    volumes:
      - discord_bot_hoshizune_postgres_full_data:/var/lib/postgresql/data
    networks:
      - discord-bot-hoshizune-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot-hoshizune-bot-full
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/discord_bot_hoshizune
    networks:
      - discord-bot-hoshizune-net

networks:
  discord-bot-hoshizune-net:
    driver: bridge

volumes:
  discord_bot_hoshizune_postgres_full_data:
